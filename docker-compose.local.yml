version: "3.9"

services:
  # ── PostgreSQL (Raw Data Store + Silver/Gold Views) ─────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fixtrade
      POSTGRES_USER: fixtrade
      POSTGRES_PASSWORD: fixtrade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixtrade"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── pgAdmin (PostgreSQL Management UI) ──────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fixtrade.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Redis (Prediction Cache + Feature Store) ────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
