services:
  # ── PostgreSQL (Raw Data Store + Silver/Gold Views) ─────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fixtrade
      POSTGRES_USER: fixtrade
      POSTGRES_PASSWORD: fixtrade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixtrade"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis (Prediction Cache + Feature Store) ────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Application ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - FIXTRADE_DATA_DIR=/app/data
      - DATABASE_URL=postgresql://fixtrade:fixtrade@postgres:5432/fixtrade
      - REDIS_URL=redis://redis:6379/0
      - ML_SERVICE_URL=http://ml-service:8001
      - AUTH_SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - .:/app:rw
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - postgres
      - redis
      - ml-service
      - auth-service
      - genai-service
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  ml-service:
    build:
      context: .
      dockerfile: docker/ml_service.Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - FIXTRADE_DATA_DIR=/app/data
      - DATABASE_URL=postgresql://fixtrade:fixtrade@postgres:5432/fixtrade
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - .:/app:rw
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    command: ["uvicorn", "app.ml_service.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  auth-service:
    build:
      context: .
      dockerfile: docker/auth.Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+pg8000://fixtrade:fixtrade@postgres:5432/fixtrade
      - AUTH_SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - .:/app:rw
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/v1/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  genai-service:
    build:
      context: .
      dockerfile: docker/genai.Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app:rw
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/api/v1/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    # Serve the locally built static site from ./frontend/dist
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  etl-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file:
      - .env
    environment:
      - SCRAPING_POSTGRES_DSN=${SCRAPING_POSTGRES_DSN}
      - SCRAPER_USER_AGENT=fixtrade-etl-worker/1.0
    volumes:
      - .:/app:rw
      - ./data:/app/data
    depends_on:
      - postgres
    command: ["python", "scripts/load_fallback_articles.py"]
    restart: "no"

  scraper:
    build:
      context: .
      dockerfile: docker/scraper.Dockerfile
    depends_on:
      - postgres
    env_file: .env
    environment:
      SCRAPING_POSTGRES_DSN: ${SCRAPING_POSTGRES_DSN}
    volumes:
      - .:/app:rw
      - ./data:/app/data
    # Run as a long-running worker that periodically runs the crawler
    command: ["python", "scripts/scraper_worker.py"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,time; p='data/last_scrape.txt';
try:
    if not os.path.exists(p): raise SystemExit(1)
    t=time.time()-float(open(p).read().strip());
    sys.exit(0 if t<86400 else 1)
except Exception:
    raise SystemExit(1)",
        ]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
