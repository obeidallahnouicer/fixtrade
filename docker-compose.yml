services:
  # ── PostgreSQL (Raw Data Store + Silver/Gold Views) ─────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fixtrade
      POSTGRES_USER: fixtrade
      POSTGRES_PASSWORD: fixtrade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixtrade"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis (Prediction Cache + Feature Store) ────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Application ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - FIXTRADE_DATA_DIR=/app/data
      - DATABASE_URL=postgresql://fixtrade:fixtrade@postgres:5432/fixtrade
      - REDIS_URL=redis://redis:6379/0
      - ML_SERVICE_URL=http://ml-service:8001
      - AUTH_SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - .:/app:rw
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      genai-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  ml-service:
    build:
      context: .
      dockerfile: docker/ml_service.Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - FIXTRADE_DATA_DIR=/app/data
      - DATABASE_URL=postgresql://fixtrade:fixtrade@postgres:5432/fixtrade
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - .:/app:rw
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["uvicorn", "app.ml_service.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  auth-service:
    build:
      context: .
      dockerfile: docker/auth.Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+pg8000://fixtrade:fixtrade@postgres:5432/fixtrade
      - AUTH_SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - .:/app:rw
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/v1/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  genai-service:
    build:
      context: .
      dockerfile: docker/genai.Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app:rw
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/api/v1/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    # Serve the locally built static site from ./frontend/dist
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  etl-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fixtrade
      - POSTGRES_USER=fixtrade
      - POSTGRES_PASSWORD=fixtrade
      - DATABASE_URL=postgresql://fixtrade:fixtrade@postgres:5432/fixtrade
      - SCRAPING_POSTGRES_DSN=postgresql://fixtrade:fixtrade@postgres:5432/fixtrade
      - SCRAPER_USER_AGENT=fixtrade-etl-worker/1.0
      - PIPELINE_INTERVAL_SECONDS=300
      - PIPELINE_RETRAIN_INTERVAL_SECONDS=604800
      - PIPELINE_SYMBOLS=BIAT,SFBT,BT
      - PIPELINE_ENABLE_ML=true
    volumes:
      - .:/app:rw
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/automation_worker.py"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,psycopg2; c=psycopg2.connect(os.environ['DATABASE_URL']); q=c.cursor(); q.execute(\"SELECT EXISTS (SELECT 1 FROM pipeline_runs WHERE job_name='automation_cycle' AND status='completed' AND started_at > NOW() - INTERVAL '20 minutes')\"); raise SystemExit(0 if q.fetchone()[0] else 1)",
        ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 10m

  scraper:
    build:
      context: .
      dockerfile: docker/scraper.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: fixtrade
      POSTGRES_USER: fixtrade
      POSTGRES_PASSWORD: fixtrade
      SCRAPING_POSTGRES_DSN: postgresql://fixtrade:fixtrade@postgres:5432/fixtrade
      SCRAPING_FALLBACK_PATH: /app/data/scraped_fallback.jsonl
      SCRAPER_INTERVAL_SECONDS: 3600
    volumes:
      - .:/app:rw
      - ./data:/app/data
    # Run as a long-running worker that periodically runs the crawler
    command: ["python", "scripts/scraper_worker.py"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,time; p='data/last_scrape.txt'; sys.exit(0 if os.path.exists(p) and time.time()-float(open(p).read().strip())<86400 else 1)",
        ]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
