server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the internal API service
    location /api/ {
        # Forward the request to the API upstream; when proxy_pass does not
        # include a URI, nginx forwards the original request URI unchanged.
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Serve index.html for SPA routes (fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Internal probe: directly forward to API health for debugging
    location = /_probe {
        proxy_pass http://api:8000/api/v1/health;
    }

    # Explicit favicon handling
    location = /favicon.ico {
        try_files /favicon.ico =404;
    }
}
